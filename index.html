<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sobre la Roca · Propiedades en venta</title>
<meta name="description" content="Casas y proyectos en venta de Sobre la Roca en Quetzaltenango." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#101826; --navy-deep:#0a0f18; --gold:#C9A227; --gold-soft:#e0c265;
    --cream:#EDE7D9; --ink:#171f2d; --line:#2a3547;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0; background:var(--navy); color:var(--cream); font-family:'Work Sans', sans-serif; font-weight:300; line-height:1.6; -webkit-font-smoothing:antialiased;}
  h1,h2,h3,.display{font-family:'Cormorant Garamond', serif; font-weight:500; letter-spacing:0.01em;}
  .eyebrow{font-size:11px; letter-spacing:0.28em; text-transform:uppercase; color:var(--gold); font-weight:500;}
  a{color:inherit;}
  img{max-width:100%; display:block;}
  .wrap{max-width:1080px; margin:0 auto; padding:0 24px;}
  button{font-family:inherit;}

  header{position:fixed; top:0; left:0; right:0; z-index:50; background:rgba(10,15,24,0.88); backdrop-filter:blur(8px); border-bottom:1px solid rgba(255,255,255,0.06);}
  .header-inner{display:flex; align-items:center; justify-content:space-between; padding:14px 24px; max-width:1080px; margin:0 auto;}
  .brand{display:flex; align-items:center; gap:10px; text-decoration:none; cursor:pointer;}
  .brand img{height:34px; width:34px; object-fit:contain;}
  .brand-text .name{font-family:'Cormorant Garamond', serif; font-size:19px; line-height:1.1;}
  .brand-text .tag{font-size:9px; letter-spacing:0.22em; color:var(--gold); text-transform:uppercase;}
  .header-cta{display:flex; align-items:center; gap:8px; background:var(--gold); color:var(--navy-deep); padding:9px 18px; border-radius:2px; font-size:13px; font-weight:500; text-decoration:none;}
  main{padding-top:76px; min-height:70vh;}

  .breadcrumb{font-size:12px; color:#8892a3; margin:24px 0 6px; display:flex; align-items:center; gap:6px;}
  .breadcrumb a{color:var(--gold-soft); text-decoration:none;}

  /* ---------- Hero genérico ---------- */
  .page-hero{padding:52px 0 20px;}
  .page-hero h1{font-size:clamp(32px,5vw,52px); margin:8px 0 10px;}
  .page-hero p{color:#8892a3; max-width:560px;}

  /* ---------- Tarjetas de proyecto/propiedad ---------- */
  .cards-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:20px; margin:34px 0 70px;}
  @media (max-width:900px){.cards-grid{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:620px){.cards-grid{grid-template-columns:1fr;}}
  .card{
    background:var(--ink); border:1px solid var(--line); border-radius:2px; overflow:hidden;
    text-decoration:none; display:block; transition:border-color .25s ease, transform .25s ease;
  }
  .card:hover{border-color:var(--gold); transform:translateY(-2px);}
  .card .thumb{width:100%; height:190px; object-fit:cover; background:#1c2534;}
  .card .body{padding:18px 20px;}
  .card h3{margin:0 0 6px; font-size:21px;}
  .card .meta{font-size:12.5px; color:#8892a3;}
  .card .badge{
    display:inline-block; margin-top:10px; font-size:10.5px; letter-spacing:0.08em; text-transform:uppercase;
    padding:4px 10px; border-radius:20px; border:1px solid var(--gold); color:var(--gold-soft);
  }
  .badge.vendida{border-color:#7a5a4a; color:#c99178;}
  .badge.reservada{border-color:#7a6a3a; color:#d4b866;}
  .badge.construccion{border-color:#3a6a7a; color:#7ec9d9;}

  .empty-state{color:#8892a3; text-align:center; padding:80px 20px; font-size:15px;}

  /* ---------- Detalle de propiedad (mismo patrón visual de antes) ---------- */
  .hero{position:relative; min-height:78vh; display:flex; align-items:flex-end; background:#000;}
  .hero-img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0.62;}
  .hero::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg, rgba(10,15,24,0.35) 0%, rgba(10,15,24,0.35) 40%, rgba(10,15,24,0.97) 96%);}
  .hero-content{position:relative; z-index:2; padding:0 24px 70px; max-width:1080px; margin:0 auto; width:100%;}
  .hero h1{font-size:clamp(34px,6vw,64px); line-height:1.02; margin:14px 0 16px; max-width:760px;}
  .hero p.lead{font-size:16px; max-width:520px; color:#cfd6e2; margin-bottom:26px;}
  .cta-row{display:flex; gap:14px; flex-wrap:wrap;}
  .btn{display:inline-flex; align-items:center; gap:9px; padding:14px 26px; border-radius:2px; font-size:14px; font-weight:500; text-decoration:none; letter-spacing:0.02em; border:1px solid transparent; cursor:pointer;}
  .btn-gold{background:var(--gold); color:var(--navy-deep);}
  .btn-outline{border-color:rgba(237,231,217,0.35); color:var(--cream); background:none;}
  .btn svg{width:17px; height:17px;}

  .mountain-divider{width:100%; height:40px; display:block;}
  .mountain-divider path{fill:none; stroke:var(--gold); stroke-width:1.4; opacity:0.55;}

  .facts{display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--line); border-top:1px solid var(--line); border-bottom:1px solid var(--line);}
  .fact{background:var(--navy); padding:26px 16px; text-align:center;}
  .fact .num{font-family:'Cormorant Garamond', serif; font-size:34px; color:var(--gold-soft);}
  .fact .lbl{font-size:10.5px; letter-spacing:0.12em; text-transform:uppercase; color:#8892a3; margin-top:4px;}

  section.pane{padding:70px 0;}
  .section-head{max-width:600px; margin-bottom:38px;}
  .section-head h2{font-size:clamp(28px,4vw,40px); margin:8px 0 0;}

  .desc-grid{display:grid; grid-template-columns:1.1fr 0.9fr; gap:50px; align-items:start;}
  .desc-grid p{color:#cfd6e2; font-size:16px;}
  .desc-photo{position:relative;}
  .desc-photo img{border-radius:2px;}
  .desc-photo::before{content:""; position:absolute; top:-14px; left:-14px; right:14px; bottom:14px; border:1px solid var(--gold); z-index:-1; opacity:0.5;}
  .financing-box{
    margin-top:20px; background:linear-gradient(135deg, rgba(201,162,39,0.12), rgba(201,162,39,0.03));
    border:1px solid rgba(201,162,39,0.4); border-radius:2px; padding:18px 20px;
  }
  .financing-title{font-family:'Cormorant Garamond', serif; font-size:19px; color:var(--gold-soft); margin-bottom:4px;}
  .financing-detail{font-size:13.5px; color:#cfd6e2;}

  .ficha{background:var(--ink); border:1px solid var(--line); border-radius:2px; padding:36px;}
  .ficha-item{display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); font-size:14.5px; color:#dfe4ec;}
  .ficha-item svg{width:18px; height:18px; color:var(--gold); flex-shrink:0;}
  .ficha-cols{columns:2; column-gap:36px;}
  .ficha-cols .ficha-item{break-inside:avoid;}
  @media (max-width:640px){.ficha-cols{columns:1;}}

  .gallery{column-count:3; column-gap:8px;}
  .gallery a{display:block; break-inside:avoid; margin-bottom:8px; border-radius:3px; overflow:hidden;}
  .gallery img{width:100%; height:auto; display:block; cursor:pointer; transition:transform .5s ease, opacity .3s ease;}
  .gallery a:hover img{transform:scale(1.035); opacity:0.92;}
  @media (max-width:820px){.gallery{column-count:2;}}
  @media (max-width:480px){.gallery{column-count:1;}}

  .lightbox{display:none; position:fixed; inset:0; z-index:100; background:rgba(6,9,15,0.94); align-items:center; justify-content:center; padding:30px;}
  .lightbox.open{display:flex;}
  .lightbox img{max-width:92vw; max-height:88vh; border-radius:2px;}
  .lightbox-close{position:absolute; top:22px; right:26px; color:var(--cream); font-size:28px; cursor:pointer; line-height:1; background:none; border:none;}
  .lightbox-nav{position:absolute; top:50%; transform:translateY(-50%); background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.2); color:var(--cream); width:46px; height:46px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer;}
  .lightbox-nav svg{width:20px; height:20px;}
  .lightbox-prev{left:18px;} .lightbox-next{right:18px;}
  .lightbox-count{position:absolute; bottom:20px; left:50%; transform:translateX(-50%); font-size:12px; color:#8892a3;}

  .location-box{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:18px; background:var(--ink); border:1px solid var(--line); padding:28px 32px; border-radius:2px;}
  .location-box .addr{display:flex; gap:12px; align-items:flex-start;}
  .location-box svg{width:20px; height:20px; color:var(--gold); margin-top:2px; flex-shrink:0;}
  .location-box h3{margin:0 0 3px; font-size:20px;}
  .location-box p{margin:0; color:#8892a3; font-size:13.5px;}
  .map-embed{margin-top:14px; border-radius:2px; overflow:hidden; border:1px solid var(--line);}
  .map-embed iframe{display:block;}

  .contact-wrap{display:grid; grid-template-columns:1fr 1fr; gap:50px;}
  @media (max-width:820px){.contact-wrap{grid-template-columns:1fr;}}
  .whatsapp-card{background:linear-gradient(160deg, #17381f, var(--ink) 60%); border:1px solid #2b4a34; border-radius:2px; padding:32px;}
  .whatsapp-card h3{font-size:24px; margin:0 0 8px;}
  .whatsapp-card p{color:#cfd6e2; font-size:14px; margin-bottom:18px;}
  .asesores-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .asesor-card{
    display:flex; flex-direction:column; align-items:center; gap:8px; text-align:center;
    background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.1);
    padding:16px 10px; border-radius:2px; text-decoration:none; transition:border-color .2s ease, transform .2s ease;
  }
  .asesor-card:hover{border-color:#3ecf68; transform:translateY(-2px);}
  .asesor-card img{width:64px; height:64px; border-radius:50%; object-fit:cover; border:2px solid rgba(201,162,39,0.5);}
  .asesor-card .nombre{font-size:14px; font-weight:500;}
  .asesor-card .wa-mini{display:flex; align-items:center; gap:5px; font-size:11.5px; color:#3ecf68;}
  .asesor-card .wa-mini svg{width:13px; height:13px;}
  @media (max-width:420px){.asesores-grid{grid-template-columns:1fr;}}
  .wa-btn{display:flex; align-items:center; justify-content:space-between; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.1); padding:13px 16px; border-radius:2px; text-decoration:none; margin-bottom:9px; font-size:14.5px;}
  .wa-btn:hover{border-color:#3ecf68;}
  .wa-btn svg{width:19px; height:19px; color:#3ecf68;}

  form{display:flex; flex-direction:column; gap:14px;}
  form > div{display:flex; flex-direction:column; gap:6px;}
  label{font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:#8892a3; display:block;}
  input, textarea{width:100%; background:var(--ink); border:1px solid var(--line); color:var(--cream); padding:12px 14px; border-radius:2px; font-family:inherit; font-size:14.5px; outline:none;}
  input:focus, textarea:focus{border-color:var(--gold);}
  textarea{resize:vertical; min-height:90px;}
  .submit-btn{background:var(--gold); color:var(--navy-deep); border:none; padding:14px 20px; border-radius:2px; font-size:14.5px; font-weight:500; cursor:pointer;}
  .submit-btn:disabled{opacity:0.5; cursor:default;}
  .form-msg{font-size:13.5px;}
  .form-msg.ok{color:#3ecf68;} .form-msg.err{color:#e2685f;}

  footer{padding:44px 0 30px; text-align:center; border-top:1px solid var(--line);}
  footer .brand-foot{display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:8px;}
  footer .brand-foot img{height:28px;}
  footer .tag{font-size:10px; letter-spacing:0.26em; color:var(--gold); text-transform:uppercase;}
  footer .fine{font-size:12px; color:#5c6576; margin-top:12px;}

  .fab{position:fixed; bottom:22px; right:22px; z-index:60; background:#25D366; color:#0a0f18; width:54px; height:54px; border-radius:50%; display:flex; align-items:center; justify-content:center; box-shadow:0 6px 18px rgba(0,0,0,0.35); text-decoration:none;}
  .fab svg{width:26px; height:26px;}

  .loading{color:#8892a3; text-align:center; padding:60px 20px; font-size:14px;}

  @media (max-width:820px){.desc-grid, .contact-wrap{grid-template-columns:1fr;}}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <a href="#/" class="brand">
      <img src="fotos/logo.png" alt="Sobre la Roca" />
      <div class="brand-text">
        <div class="name">Sobre la Roca</div>
        <div class="tag">Fe · Creer · Construir</div>
      </div>
    </a>
    <a href="https://wa.me/50248740168" class="header-cta" target="_blank" rel="noopener">Escríbenos</a>
  </div>
</header>

<main id="app">
  <div class="loading">Cargando...</div>
</main>

<a class="fab" href="https://wa.me/50248740168" target="_blank" rel="noopener" aria-label="WhatsApp">
  <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12c0 1.85.5 3.58 1.36 5.07L2 22l5.07-1.33A9.94 9.94 0 0012 22c5.52 0 10-4.48 10-10S17.52 2 12 2zm5.2 14.2c-.22.62-1.28 1.19-1.77 1.24-.45.05-.9.24-3.04-.63-2.58-1.05-4.24-3.68-4.37-3.85-.13-.17-1.04-1.38-1.04-2.63 0-1.25.66-1.86.89-2.11.22-.25.5-.31.66-.31.17 0 .33 0 .48.01.15.01.36-.06.56.43.22.53.73 1.83.8 1.97.06.13.1.29.02.46-.08.17-.13.28-.25.43-.13.15-.27.34-.38.46-.13.13-.26.27-.11.53.15.26.66 1.09 1.42 1.77.98.87 1.8 1.14 2.06 1.27.26.13.41.11.56-.06.15-.18.65-.76.82-1.02.17-.26.34-.22.56-.13.22.08 1.42.67 1.67.79.25.13.41.19.47.3.06.11.06.61-.16 1.23z"/></svg>
</a>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
  const supabase = createClient('https://knquysqjhprnyztkgmwb.supabase.co', 'sb_publishable_lUjd1hMqkWqnQ4Q8qun5FA_WU-1UOIf');

  const WA_ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12c0 1.85.5 3.58 1.36 5.07L2 22l5.07-1.33A9.94 9.94 0 0012 22c5.52 0 10-4.48 10-10S17.52 2 12 2zm5.2 14.2c-.22.62-1.28 1.19-1.77 1.24-.45.05-.9.24-3.04-.63-2.58-1.05-4.24-3.68-4.37-3.85-.13-.17-1.04-1.38-1.04-2.63 0-1.25.66-1.86.89-2.11.22-.25.5-.31.66-.31.17 0 .33 0 .48.01.15.01.36-.06.56.43.22.53.73 1.83.8 1.97.06.13.1.29.02.46-.08.17-.13.28-.25.43-.13.15-.27.34-.38.46-.13.13-.26.27-.11.53.15.26.66 1.09 1.42 1.77.98.87 1.8 1.14 2.06 1.27.26.13.41.11.56-.06.15-.18.65-.76.82-1.02.17-.26.34-.22.56-.13.22.08 1.42.67 1.67.79.25.13.41.19.47.3.06.11.06.61-.16 1.23z"/></svg>';

  const FICHA_ICONS = {
    niveles: '<path d="M3 10.5L12 4l9 6.5"/><path d="M5 9.5V20h14V9.5"/>',
    parqueos: '<rect x="3" y="8" width="18" height="12" rx="1"/><path d="M7 8V6a2 2 0 012-2h6a2 2 0 012 2v2"/>',
    hab: '<path d="M3 9l9-6 9 6M5 9v11h14V9"/>',
    banos: '<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>',
    generic: '<circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 2"/>',
  };

  function estadoBadge(estado) {
    const map = {
      disponible: ['Disponible', ''],
      reservada: ['Reservada', 'reservada'],
      vendida: ['Vendida', 'vendida'],
      en_construccion: ['En construcción', 'construccion'],
    };
    const [texto, clase] = map[estado] || ['Disponible', ''];
    return `<span class="badge ${clase}">${texto}</span>`;
  }

  function waLink(numero, propiedad, proyecto) {
    const nombreCompleto = proyecto ? `${propiedad} (${proyecto})` : propiedad;
    const texto = encodeURIComponent(`Hola, me interesa la propiedad "${nombreCompleto}"`);
    return `https://wa.me/${numero}?text=${texto}`;
  }

  function fmtQ(n) {
    if (n == null) return '';
    return 'Q' + Number(n).toLocaleString('es-GT');
  }

  const app = document.getElementById('app');

  async function vistaProyectos() {
    app.innerHTML = '<div class="loading">Cargando proyectos...</div>';
    const { data: proyectos, error } = await supabase
      .from('proyectos_venta')
      .select('*, propiedades_venta(id, estado), fotos:propiedades_venta(fotos_propiedad_venta(archivo_url, orden))')
      .order('orden');

    if (error || !proyectos) {
      app.innerHTML = '<div class="wrap loading">No se pudieron cargar los proyectos.</div>';
      return;
    }

    if (proyectos.length === 0) {
      app.innerHTML = '<div class="wrap empty-state">Aún no hay proyectos publicados.</div>';
      return;
    }

    const tarjetas = proyectos.map((p) => {
      const disponibles = (p.propiedades_venta || []).filter(x => x.estado !== 'vendida').length;
      const total = (p.propiedades_venta || []).length;
      let foto = p.foto_portada || null;
      if (!foto) {
        for (const grupo of (p.fotos || [])) {
          const fs = (grupo.fotos_propiedad_venta || []).sort((a,b)=>a.orden-b.orden);
          if (fs[0]) { foto = fs[0].archivo_url; break; }
        }
      }
      return `
        <a class="card" href="#/proyecto/${p.id}">
          <img class="thumb" src="${foto || 'fotos/logo.png'}" alt="${p.nombre}" />
          <div class="body">
            <h3>${p.nombre}</h3>
            <div class="meta">${p.ubicacion || ''}</div>
            <div class="badge">${total} propiedad${total !== 1 ? 'es' : ''} · ${disponibles} disponible${disponibles !== 1 ? 's' : ''}</div>
          </div>
        </a>`;
    }).join('');

    app.innerHTML = `
      <div class="wrap page-hero">
        <div class="eyebrow">Sobre la Roca</div>
        <h1>Proyectos en venta</h1>
        <p>Conoce nuestros desarrollos y encuentra la propiedad ideal para tu familia.</p>
      </div>
      <div class="wrap cards-grid">${tarjetas}</div>
    `;
  }

  async function vistaPropiedades(proyectoId) {
    app.innerHTML = '<div class="loading">Cargando propiedades...</div>';
    const { data: proyecto } = await supabase.from('proyectos_venta').select('*').eq('id', proyectoId).maybeSingle();
    const { data: propiedades, error } = await supabase
      .from('propiedades_venta')
      .select('*, fotos_propiedad_venta(archivo_url, orden)')
      .eq('proyecto_venta_id', proyectoId)
      .order('orden');

    if (!proyecto || error) {
      app.innerHTML = '<div class="wrap loading">No se encontró el proyecto.</div>';
      return;
    }

    const tarjetas = (propiedades || []).map((p) => {
      const fotos = (p.fotos_propiedad_venta || []).sort((a,b)=>a.orden-b.orden);
      const foto = fotos[0]?.archivo_url || 'fotos/logo.png';
      return `
        <a class="card" href="#/propiedad/${p.id}">
          <img class="thumb" src="${foto}" alt="${p.nombre}" />
          <div class="body">
            <h3>${p.nombre}</h3>
            <div class="meta">${p.habitaciones || '–'} hab · ${p.banos || '–'} baños · ${p.niveles || '–'} niveles</div>
            ${estadoBadge(p.estado)}
            ${p.financiamiento_propio ? '<span class="badge" style="border-color:var(--gold); color:var(--gold-soft); margin-left:6px;">Financiamiento propio</span>' : ''}
          </div>
        </a>`;
    }).join('') || '<div class="empty-state">Este proyecto aún no tiene propiedades publicadas.</div>';

    app.innerHTML = `
      <div class="wrap">
        <div class="breadcrumb"><a href="#/">Proyectos</a> · ${proyecto.nombre}</div>
      </div>
      <div class="wrap page-hero">
        <div class="eyebrow">${proyecto.ubicacion || ''}</div>
        <h1>${proyecto.nombre}</h1>
        <p>${proyecto.descripcion || ''}</p>
      </div>
      <div class="wrap cards-grid">${tarjetas}</div>
    `;
  }

  async function vistaDetalle(propiedadId) {
    app.innerHTML = '<div class="loading">Cargando propiedad...</div>';
    const { data: p, error } = await supabase
      .from('propiedades_venta')
      .select('*, proyectos_venta(id, nombre, ubicacion), fotos_propiedad_venta(archivo_url, orden)')
      .eq('id', propiedadId)
      .maybeSingle();

    if (!p || error) {
      app.innerHTML = '<div class="wrap loading">No se encontró la propiedad.</div>';
      return;
    }

    const fotos = (p.fotos_propiedad_venta || []).sort((a,b)=>a.orden-b.orden).map(f => f.archivo_url);
    const proyecto = p.proyectos_venta;
    const wa1 = p.whatsapp_1, wa2 = p.whatsapp_2;

    const ficha = (p.caracteristicas || []).map(c =>
      `<div class="ficha-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">${FICHA_ICONS.generic}</svg><span>${c}</span></div>`
    ).join('');

    app.innerHTML = `
      <section class="hero">
        <img class="hero-img" src="${fotos[0] || 'fotos/logo.png'}" alt="${p.nombre}" />
        <div class="hero-content">
          <div class="eyebrow">${proyecto ? proyecto.nombre + (proyecto.ubicacion ? ' · ' + proyecto.ubicacion : '') : ''}</div>
          <h1>${p.nombre}</h1>
          <p class="lead">${(p.descripcion || '').split('.').slice(0,2).join('.')}${p.descripcion ? '.' : ''}</p>
          <div class="cta-row">
            <a class="btn btn-gold" href="javascript:void(0)" onclick="document.getElementById('contacto')?.scrollIntoView({behavior:'smooth'})">${WA_ICON} Escríbenos por WhatsApp</a>
            <a class="btn btn-outline" href="javascript:void(0)" onclick="document.getElementById('galeria')?.scrollIntoView({behavior:'smooth'})">Ver fotos</a>
          </div>
        </div>
      </section>

      <svg class="mountain-divider" viewBox="0 0 1200 40" preserveAspectRatio="none">
        <path d="M0 34 L120 18 L200 28 L300 8 L420 26 L520 5 L640 24 L760 14 L880 28 L1000 10 L1100 22 L1200 15" />
      </svg>

      <div class="facts">
        <div class="fact"><div class="num">${p.habitaciones ?? '–'}</div><div class="lbl">Habitaciones</div></div>
        <div class="fact"><div class="num">${p.banos ?? '–'}</div><div class="lbl">Baños</div></div>
        <div class="fact"><div class="num">${p.niveles ?? '–'}</div><div class="lbl">Niveles</div></div>
        <div class="fact"><div class="num">${p.parqueos ?? '–'}</div><div class="lbl">Parqueos</div></div>
      </div>

      <section class="wrap pane">
        <div class="desc-grid">
          <div>
            <div class="eyebrow">La propiedad</div>
            <h2 style="margin:8px 0 18px;">${p.nombre}</h2>
            <p>${p.descripcion || ''}</p>
            <p style="margin-top:18px;">${estadoBadge(p.estado)}</p>
            ${p.financiamiento_propio ? `
            <div class="financing-box">
              <div class="financing-title">💰 Financiamiento propio disponible</div>
              <div class="financing-detail">
                Enganche desde ${fmtQ(p.financiamiento_enganche_desde)} · hasta ${p.financiamiento_plazo_max_anios || ''} años de plazo · abonos a capital sin penalización.
              </div>
            </div>` : ''}
          </div>
          ${(p.foto_secundaria || fotos[1]) ? `<div class="desc-photo"><img src="${p.foto_secundaria || fotos[1]}" alt="${p.nombre}" /></div>` : ''}
        </div>
      </section>

      ${ficha ? `
      <section class="wrap pane" style="padding-top:0;">
        <div class="section-head"><div class="eyebrow">Ficha técnica</div><h2>Todo lo que incluye</h2></div>
        <div class="ficha"><div class="ficha-cols">${ficha}</div></div>
      </section>` : ''}

      ${fotos.length ? `
      <section class="wrap pane" style="padding-top:0;" id="galeria">
        <div class="section-head"><div class="eyebrow">Galería</div><h2>Conócela por dentro</h2></div>
        <div class="gallery" id="gallery"></div>
      </section>` : ''}

      <div class="lightbox" id="lightbox">
        <button class="lightbox-close" id="lightboxClose">&times;</button>
        <button class="lightbox-nav lightbox-prev" id="lightboxPrev" aria-label="Anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button>
        <img id="lightboxImg" src="" alt="Foto ampliada" />
        <button class="lightbox-nav lightbox-next" id="lightboxNext" aria-label="Siguiente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></button>
        <div class="lightbox-count" id="lightboxCount"></div>
      </div>

      ${proyecto ? `
      <section class="wrap pane" style="padding-top:0;">
        <div class="location-box">
          <div class="addr">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 21s-7-6.2-7-11a7 7 0 1114 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
            <div><h3>${proyecto.nombre}</h3><p>${proyecto.ubicacion || ''}</p></div>
          </div>
          ${p.google_maps_url ? `<a class="btn btn-outline" href="${p.google_maps_url}" target="_blank" rel="noopener">Abrir en Google Maps</a>` : ''}
        </div>
        ${p.google_maps_lat && p.google_maps_lng ? `
        <div class="map-embed">
          <iframe src="https://www.google.com/maps?q=${p.google_maps_lat},${p.google_maps_lng}&z=16&output=embed" width="100%" height="320" style="border:0;" loading="lazy"></iframe>
        </div>` : ''}
      </section>` : ''}

      <section class="wrap pane" id="contacto">
        <div class="section-head"><div class="eyebrow">Contacto</div><h2>Agenda tu visita hoy mismo</h2></div>
        <div class="contact-wrap">
          <div class="whatsapp-card">
            <h3>Escríbenos directo</h3>
            <p>¿Qué asesor deseas que te contacte?</p>
            <div class="asesores-grid" id="asesoresGrid"><div style="color:#8892a3; font-size:13px;">Cargando asesores...</div></div>
          </div>
          <div>
            <form id="contactForm">
              <div><label for="nombre">Nombre</label><input type="text" id="nombre" required /></div>
              <div><label for="telefono">Teléfono</label><input type="tel" id="telefono" required /></div>
              <div><label for="mensaje">Mensaje</label><textarea id="mensaje" placeholder="Cuéntanos qué te gustaría saber..."></textarea></div>
              <button type="submit" class="submit-btn" id="submitBtn">Enviar mensaje</button>
              <div class="form-msg" id="formMsg"></div>
            </form>
          </div>
        </div>
      </section>
    `;

    // Galería + lightbox
    if (fotos.length) {
      const galeria = document.getElementById('gallery');
      let indiceActual = 0;
      fotos.forEach((f, i) => {
        const a = document.createElement('a');
        a.href = '#';
        const img = document.createElement('img');
        img.src = f; img.alt = p.nombre; img.loading = 'lazy';
        a.appendChild(img);
        a.addEventListener('click', (e) => { e.preventDefault(); abrir(i); });
        galeria.appendChild(a);
      });
      function abrir(i) {
        indiceActual = (i + fotos.length) % fotos.length;
        document.getElementById('lightboxImg').src = fotos[indiceActual];
        document.getElementById('lightboxCount').textContent = (indiceActual+1) + ' / ' + fotos.length;
        document.getElementById('lightbox').classList.add('open');
      }
      function cerrar(){ document.getElementById('lightbox').classList.remove('open'); }
      document.getElementById('lightboxClose').addEventListener('click', cerrar);
      document.getElementById('lightboxPrev').addEventListener('click', () => abrir(indiceActual-1));
      document.getElementById('lightboxNext').addEventListener('click', () => abrir(indiceActual+1));
      document.getElementById('lightbox').addEventListener('click', (e) => { if (e.target.id === 'lightbox') cerrar(); });
      document.addEventListener('keydown', (e) => {
        if (!document.getElementById('lightbox').classList.contains('open')) return;
        if (e.key === 'Escape') cerrar();
        if (e.key === 'ArrowLeft') abrir(indiceActual-1);
        if (e.key === 'ArrowRight') abrir(indiceActual+1);
      });
    }

    // Asesores
    const { data: asesores } = await supabase.from('asesores').select('*').eq('activo', true).order('orden');
    const grid = document.getElementById('asesoresGrid');
    if (asesores && asesores.length) {
      grid.innerHTML = asesores.map(a => `
        <a class="asesor-card" href="${waLink(a.whatsapp, p.nombre, proyecto?.nombre)}" target="_blank" rel="noopener">
          <img src="${a.foto_url}" alt="${a.nombre}" />
          <div class="nombre">${a.nombre}</div>
          <div class="wa-mini">${WA_ICON} WhatsApp</div>
        </a>`).join('');
    } else {
      grid.innerHTML = '<div style="color:#8892a3; font-size:13px;">Escríbenos por WhatsApp para más información.</div>';
    }

    // Formulario
    const form = document.getElementById('contactForm');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const msg = document.getElementById('formMsg');
      btn.disabled = true; btn.textContent = 'Enviando...'; msg.textContent = ''; msg.className = 'form-msg';
      const { error } = await supabase.from('contactos_web').insert({
        nombre: document.getElementById('nombre').value,
        telefono: document.getElementById('telefono').value,
        mensaje: document.getElementById('mensaje').value,
        propiedad: p.nombre,
      });
      btn.disabled = false; btn.textContent = 'Enviar mensaje';
      if (error) { msg.textContent = 'No se pudo enviar. Escríbenos por WhatsApp.'; msg.classList.add('err'); }
      else { msg.textContent = '¡Gracias! Te contactaremos pronto.'; msg.classList.add('ok'); form.reset(); }
    });
  }

  async function render() {
    const hash = location.hash || '#/';
    const partes = hash.replace('#/', '').split('/').filter(Boolean);
    window.scrollTo(0,0);
    if (partes[0] === 'proyecto' && partes[1]) await vistaPropiedades(partes[1]);
    else if (partes[0] === 'propiedad' && partes[1]) await vistaDetalle(partes[1]);
    else await vistaProyectos();
  }

  window.addEventListener('hashchange', render);
  render();
</script>

<footer>
  <div class="wrap">
    <div class="brand-foot"><img src="fotos/logo.png" alt="Sobre la Roca" /></div>
    <div class="tag">Fe · Creer · Construir</div>
    <div class="fine">Sobre la Roca · Quetzaltenango, Guatemala</div>
  </div>
</footer>

</body>
</html>
